// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

// Keep generated Android build files outside cloud-synced workspaces when the
// build helper provides a cache root. This prevents OneDrive file locks from
// breaking clean/reproducible builds.
def sdnAndroidBuildRoot = System.getenv("SDN_ANDROID_BUILD_ROOT")
if (sdnAndroidBuildRoot) {
    allprojects {
        layout.buildDirectory.set(file("${sdnAndroidBuildRoot}/${project.name}"))
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin') {
                if (details.requested.name == 'kotlin-stdlib-jdk7' || details.requested.name == 'kotlin-stdlib-jdk8') {
                    details.useTarget("org.jetbrains.kotlin:kotlin-stdlib:${details.requested.version}")
                }
            }
        }
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                compileOptions {
                    sourceCompatibility = JavaVersion.VERSION_17
                    targetCompatibility = JavaVersion.VERSION_17
                }
            }
        }
    }
}

task clean(type: Delete) {
    delete fileTree(rootProject.buildDir) {
        exclude 'reports/**'
    }
}



