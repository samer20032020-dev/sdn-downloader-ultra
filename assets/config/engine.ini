[Engine]
Core=yt-dlp
Version=2026.08.19
FFmpeg=ffmpeg.exe
HardwareAcceleration=auto
StreamChunkSize=10485760
SocketTimeout=30
MaxRetries=10

[MediaConverter]
DefaultAudioCodec=libmp3lame
DefaultVideoContainer=mp4
FastStart=true
ForceKeyframes=true

[Logging]
Level=INFO
Directory=%USERPROFILE%\.sdn_logs
RotateFiles=true
MaxLogSizeMB=5
